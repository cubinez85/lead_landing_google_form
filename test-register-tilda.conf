# HTTPS сервер
server {
    listen 443 ssl;
    server_name test-register-tilda.cubinez.ru;

    ssl_certificate /etc/nginx/ssl/test-register-tilda.crt;
    ssl_certificate_key /etc/nginx/ssl/test-register-tilda.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    client_max_body_size 10M;

    access_log /var/log/nginx/test-register-tilda-ssl.access.log;
    error_log /var/log/nginx/test-register-tilda-ssl.error.log;

    # Flask API через Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}

# HTTP сервер - редирект на HTTPS
server {
    listen 80;
    server_name test-register-tilda.cubinez.ru;

    access_log /var/log/nginx/test-register-tilda.access.log;
    error_log /var/log/nginx/test-register-tilda.error.log;

    # Редирект всех запросов на HTTPS
    return 301 https://$server_name$request_uri;
}
